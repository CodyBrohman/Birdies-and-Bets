# Smoke test: a fresh install can start a round, score a hole and get back to it from Home.
# Run in the cloud: npx eas workflow:run .eas/workflows/e2e-ios.yml   (see .maestro/README.md)
appId: com.birdiesandbets.app
name: Smoke - start a round, score a hole, come back
---
- launchApp:
    clearState: true

# A build with Supabase keys opens on the welcome screen: Continue without an account (everything stays on the phone).
# A build without keys has no accounts and goes straight to the intro.
- extendedWaitUntil:
    visible:
      id: "continue-without-account|onboarding-skip"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: continue-without-account
    commands:
      - tapOn:
          id: continue-without-account

# First launch shows the intro; skipping it also answers "no" to usage analytics.
- extendedWaitUntil:
    visible:
      id: onboarding-skip
    timeout: 20000
- tapOn:
    id: onboarding-skip

# New round (Play tab): choose the bundled sample course (no network needed), add one player, start.
- tapOn:
    id: tab-play
- tapOn:
    id: choose-course
- tapOn:
    id: course-cedar-ridge-golf-club
- tapOn:
    id: add-player
- tapOn:
    id: friend-name
- inputText: Smoke
- tapOn:
    id: save-friend
- tapOn:
    id: sheet-close
- tapOn:
    id: start-round

# Scorecard: from no score + is a bogey, the second tap adds a stroke; Next (pinned) moves to hole 2.
- extendedWaitUntil:
    visible:
      id: current-hole
    timeout: 10000
- assertVisible:
    id: current-hole
    text: "Hole 1 of .*"
- tapOn:
    id: stepper-plus-0
- tapOn:
    id: stepper-plus-0
- tapOn:
    id: next-hole
- assertVisible:
    id: current-hole
    text: "Hole 2 of .*"

# Close the round (it stays in progress), then Home shows it and Resume round goes back to it.
- tapOn:
    id: round-home
- tapOn:
    id: tab-home
- extendedWaitUntil:
    visible:
      id: resume-round
    timeout: 10000
- tapOn:
    id: resume-round
- assertVisible:
    id: current-hole
    text: "Hole 2 of .*"
