# Typecheck and every Jest test (logic + screens) on each push to main and each pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      # TODO: add `npm run lint` once the existing React Compiler errors are fixed
      # (ui/Toggle.tsx, ui/LivePill.tsx, (tabs)/courses.tsx, games/GameConfigSheet.tsx).
